info:
  name: Create booking
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/bookings"
  body:
    type: json
    data: |-
      {
        "name": "Herman",
        "email": "herman@example.com",
        "dateTime": "2026-11-15T19:00:00",
        "numberOfPeople": 4
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
